## This is a library configuration file for Simple Image Library (SIL)
##   https://github.com/VCF/simpleImageLibrary
## SIL is designed to make collection and organization of images from the
## internet easy, with a focus on command line interaction

## This file provides core configuration information for a library that
## shares the same folder as the file

## Any line that starts with a '#' is a comment and is ignored

## Listed below are some of the SIL configuration parameters - 
## you can uncomment these (remove the '#' at the start) to set the parameter in question

# Will increase JPG compression to make files smaller.
# The value specified is the target file size
# For files that are not JPG, will convert to JPG

# SHRINK=250kb

# The value below is a scale factor that is used to avoid shrinking files that
# are already close in size to your desired SHRINK value. For example, if
# you have SHRINK=200kb plus SHRINKTRIGGER=1.5, the program will only try to
# shrink a file if it is at least 300kb large (200 * 1.5)

# SHRINKTRIGGER=1.5

# The value below is the minimum "savings" in order to keep the results of a shrink.
# This is to avoid altering a file for no or minimal gain. A value of 25% means
# that the shrunk file must be at least 25% smaller than the original in order for
# the original to be discarded in favor of the shrunk file.

# SHRINKMINSAVE=25%

# How similar two images must be, as a percentage, before SIL treats them as
# duplicates and stores only one. Higher values mean images must be more alike.
# Near-identical images, such as memes made from the same template, may need a
# high value like 98% to be kept as separate images. Default is 90%

# THRESHOLD=95%

# Download images through the Tor network (via torsocks). Onion addresses always
# use Tor; this applies it to regular web addresses as well. Set to 'off' (or
# 0, no, false) to disable. Requires: sudo apt install torsocks

# TOR=on

# Images with transparency, such as logos and icons, are normally never shrunk,
# because JPEG cannot store transparency. Turn this on to shrink them anyway,
# placing them on a white background first. Only applies when SHRINK is set.
# Set to 'off' (or 0, no, false) to disable. Default is off

# FLATTEN=on

# SIL records where each image came from. A web address that has been added
# before is normally treated as a duplicate without downloading it again.
# Turn this on to download such addresses again and check them by fingerprint,
# eg if a site may now show a different image at the same address.
# Set to 'off' (or 0, no, false) to disable. Default is off

# REFETCH=on
